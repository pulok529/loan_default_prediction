[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-default"
version = "1.0.0"
description = "Credit risk scoring and loan default prediction portfolio ML project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<1.6",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.28,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
